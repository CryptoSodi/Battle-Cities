name: Deploy Ubuntu API

on:
  push:
    branches:
      - master
    paths:
      - 'api-server/**'
      # The API embeds the authoritative WebRTC broadcaster built from these
      # gameplay sources. This deliberately excludes the app bootstrap,
      # scenes and admin UI, so frontend-only changes do not restart Oracle.
      - 'scripts/headless-broadcaster-runtime.ts'
      - 'scripts/engine-battle-city-simulation.ts'
      - 'src/auth/**'
      - 'src/config.ts'
      - 'src/core/**'
      - 'src/debug/**'
      - 'src/game/**'
      - 'src/gameObjects/**'
      - 'src/input/**'
      - 'src/level/**'
      - 'src/map/**'
      - 'src/network/**'
      - 'src/points/**'
      - 'src/powerup/**'
      - 'src/replay/**'
      - 'src/shop/**'
      - 'src/tank/**'
      - 'src/terrain/**'
      - 'src/types/**'
      - 'src/wallet/**'
      - 'shared/**'
      - 'data/maps/original/**'
      - 'tsconfig.broadcaster.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: battlecities-ubuntu-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Deploy through restricted SSH command
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.BATTLECITIES_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.BATTLECITIES_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.BATTLECITIES_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.BATTLECITIES_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/id_ed25519"' EXIT
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" deploy
