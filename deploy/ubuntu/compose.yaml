name: battlecities

x-server-image: &server-image
  image: battlecities-server:local
  build:
    context: ../..
    dockerfile: deploy/ubuntu/Dockerfile

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_APP_USER:-battlecities_app}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-battlecities}
  BATTLECITY_DATABASE_SSL: disable
  BATTLECITY_DATABASE_POOL_SIZE: ${BATTLECITY_DATABASE_POOL_SIZE:-10}
  BATTLECITY_WEB_BASE_URL: ${BATTLECITY_WEB_BASE_URL}
  BROADCASTER_BASE_URL: http://broadcaster:7777
  BROADCASTER_SERVICE_TOKEN: ${BROADCASTER_SERVICE_TOKEN}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
  GOOGLE_OAUTH_STATE_SECRET: ${GOOGLE_OAUTH_STATE_SECRET}
  DISCORD_APPLICATION_PUBLIC_KEY: ${DISCORD_APPLICATION_PUBLIC_KEY:-}
  DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
  DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
  DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
  DISCORD_OAUTH_STATE_SECRET: ${DISCORD_OAUTH_STATE_SECRET:-}
  DISCORD_OAUTH_REDIRECT_URI: https://${API_DOMAIN}/api/integrations/discord/oauth/callback
  DISCORD_BOT_SERVICE_TOKEN: ${DISCORD_BOT_SERVICE_TOKEN:-}
  BATTLECITY_EVENT_ADMIN_SECRET: ${BATTLECITY_EVENT_ADMIN_SECRET:-}
  BATTLECITY_SOLANA_RPC_URL: ${BATTLECITY_SOLANA_RPC_URL:-}
  BATTLECITY_BACT_MINT: ${BATTLECITY_BACT_MINT:-}
  BATTLECITY_SOL_PRICE_USD: ${BATTLECITY_SOL_PRICE_USD:-}
  BATTLECITY_SWAP_VERIFY_MODE: ${BATTLECITY_SWAP_VERIFY_MODE:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battlecities}
      POSTGRES_USER: ${POSTGRES_USER:-battlecities_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-battlecities_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-battlecities_owner} -d ${POSTGRES_DB:-battlecities}
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - backend

  migrate:
    <<: *server-image
    restart: "no"
    command: ["npm", "--prefix", "api-server", "run", "db:migrate"]
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-battlecities_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-battlecities}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    <<: *server-image
    restart: unless-stopped
    command: ["npm", "run", "api:start"]
    environment:
      <<: *api-environment
      BATTLECITY_API_HOST: 0.0.0.0
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  broadcaster:
    <<: *server-image
    restart: unless-stopped
    command: ["npm", "run", "broadcaster:start"]
    environment:
      NODE_ENV: production
      BROADCASTER_HOST: 0.0.0.0
      BROADCASTER_PORT: 7777
      BROADCASTER_API_URL: http://api:3001
      BROADCASTER_PUBLIC_URL: https://${BROADCASTER_DOMAIN}
      BROADCASTER_CLIENT_URL: ${BATTLECITY_WEB_BASE_URL}
      BROADCASTER_SERVICE_TOKEN: ${BROADCASTER_SERVICE_TOKEN}
      BROADCASTER_DISABLE_ENEMY_SHOOTING: ${BROADCASTER_DISABLE_ENEMY_SHOOTING:-0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7777/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN}
      BROADCASTER_DOMAIN: ${BROADCASTER_DOMAIN}
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      broadcaster:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
