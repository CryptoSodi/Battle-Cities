apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def dappStoreKeystorePath = System.getenv('BATTLE_CITIES_KEYSTORE_PATH') ?:
    'D:/keys/battle-cities-dappstore.keystore'
def dappStorePassword = System.getenv('BATTLE_CITIES_KEYSTORE_PASSWORD')
def dappStoreKeyPassword = System.getenv('BATTLE_CITIES_KEY_PASSWORD')
def hasDappStoreSigning =
    file(dappStoreKeystorePath).exists() &&
    dappStorePassword != null &&
    dappStoreKeyPassword != null

android {
    namespace "com.battlecities.game"
    compileSdk rootProject.ext.compileSdkVersion
    buildToolsVersion "35.0.0"
    defaultConfig {
        applicationId "com.battlecities.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.1.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main.assets.srcDir "$buildDir/generated/battleCityWeb"
    }
    signingConfigs {
        if (hasDappStoreSigning) {
            dappStore {
                storeFile file(dappStoreKeystorePath)
                storePassword dappStorePassword
                keyAlias 'battle-cities'
                keyPassword dappStoreKeyPassword
            }
        }
    }
    buildTypes {
        release {
            if (hasDappStoreSigning) {
                signingConfig signingConfigs.dappStore
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def battleCityRepoRoot = rootProject.projectDir.parentFile.parentFile
def battleCityDist = new File(battleCityRepoRoot, 'dist')
def generatedBattleCityAssets = file("$buildDir/generated/battleCityWeb/public")

tasks.register('buildBattleCityWeb', Exec) {
    workingDir battleCityRepoRoot
    commandLine 'cmd', '/c', 'npm', 'run', 'build'
    inputs.dir new File(battleCityRepoRoot, 'src')
    inputs.dir new File(battleCityRepoRoot, 'public')
    inputs.dir new File(battleCityRepoRoot, 'data')
    inputs.dir new File(battleCityRepoRoot, 'webpack')
    inputs.file new File(battleCityRepoRoot, 'package.json')
    inputs.file new File(battleCityRepoRoot, 'package-lock.json')
    inputs.file new File(battleCityRepoRoot, 'tsconfig.json')
    outputs.dir battleCityDist
}

tasks.register('syncBattleCityWeb', Sync) {
    dependsOn 'buildBattleCityWeb'
    outputs.upToDateWhen {
        !file('src/main/assets/public').exists()
    }
    doFirst {
        delete file('src/main/assets/public')
    }
    from battleCityDist
    into generatedBattleCityAssets
}

preBuild.dependsOn 'syncBattleCityWeb'

gradle.taskGraph.whenReady { taskGraph ->
    def buildsRelease = taskGraph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains('release')
    }
    if (buildsRelease && !hasDappStoreSigning) {
        throw new GradleException(
            'Release signing is not configured. Set BATTLE_CITIES_KEYSTORE_PASSWORD ' +
            'and BATTLE_CITIES_KEY_PASSWORD before building the release APK.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.credentials:credentials:1.7.0-alpha02"
    implementation "androidx.credentials:credentials-play-services-auth:1.7.0-alpha02"
    implementation "androidx.work:work-runtime:2.10.1"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
    implementation platform('com.google.firebase:firebase-bom:33.10.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.android.gms:play-services-base:18.5.0'
    implementation "com.solanamobile:mobile-wallet-adapter-clientlib-ktx:2.0.3"
    implementation "io.github.funkatronics:multimult:0.2.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
